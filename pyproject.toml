[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "cogmembench"
version = "0.1.0"
description = "A reproducible benchmark for cognitive memory in AI agents"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
authors = [{name = "MindGraph contributors"}]
dependencies = []

[project.optional-dependencies]
plots = ["matplotlib>=3.8"]
yaml = ["pyyaml>=6.0"]
dev = ["pytest>=8.0", "ruff>=0.6"]

[project.scripts]
cogmembench = "cogmembench.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["cogmembench"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
# Pin to ruff's long-standing conventional defaults (pyflakes plus a handful of
# pycodestyle error codes). Without an explicit select, newer ruff releases pull
# in a much larger opt-in rule set (isort, pylint, refurb, flake8-bugbear-style
# blind-except, pyupgrade, ruff-specific checks, ...), which flags 85 pre-existing
# findings across the package that were never part of this project's lint gate.
select = ["E4", "E7", "E9", "F"]
